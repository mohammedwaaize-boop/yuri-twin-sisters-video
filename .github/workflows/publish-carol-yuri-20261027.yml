name: Publish Carol YURI video
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-carol-yuri-20261027.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify final videos
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3928zmivRRlEagnO67dqCCUMSDW/c643230f-229a-43ea-a16b-4672f3eb6754.mp4' -o Carol_YURI_Final_Captioned_480p.mp4
          curl --fail --location --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3928zmivRRlEagnO67dqCCUMSDW/d4417cfb-cbe8-4992-b7f1-1efb98762510.mp4' -o Carol_YURI_Clean_480p.mp4
          echo '86fd7f6727f9dacfa5b5544dd9c1bd275f2067b3549269fa2ae96510c2db7747  Carol_YURI_Final_Captioned_480p.mp4' | sha256sum --check
          echo '61353317383d2f2d893243b5606a0e2fbe61567f611374fee9544efc098f991c  Carol_YURI_Clean_480p.mp4' | sha256sum --check
      - name: Publish downloadable video release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view carol-yuri-20261027 >/dev/null 2>&1; then
            gh release create carol-yuri-20261027 --target main --title 'Carol YURI — Final 480p' --notes 'Final Carol / Grandma YURI ad. 2:13, vertical 480 x 854, 24 fps. Captioned and clean MP4 versions with music and sound effects.' --draft
          fi
          gh release upload carol-yuri-20261027 Carol_YURI_Final_Captioned_480p.mp4 Carol_YURI_Clean_480p.mp4 --clobber
          gh release edit carol-yuri-20261027 --draft=false
